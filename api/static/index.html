<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ValKit console</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<a class="skip" href="#main">Skip to the workspace</a>

<header class="masthead" role="banner">
  <div class="mast-inner">
    <a class="brand" href="#/" aria-label="ValKit validations">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span>
        <span class="wordmark">ValKit</span>
        <span class="brand-meta">
          <span class="brand-subtitle">AI validation workspace</span>
          <span class="brand-version" id="mast-version"></span>
        </span>
      </span>
    </a>

    <div class="mast-actions">
      <div class="identity" id="identity">
        <div class="identity-row">
          <label for="actor-input">Record actions as</label>
          <input id="actor-input" type="text" spellcheck="false" autocomplete="off"
                 autocapitalize="off" size="16" aria-describedby="actor-note">
          <button type="button" id="actor-clear" class="linkish">Clear identity</button>
        </div>
        <p class="note" id="actor-note"></p>
      </div>

      <div class="theme" role="group" aria-label="Theme">
        <button type="button" data-theme="light" aria-pressed="false">Light</button>
        <button type="button" data-theme="system" aria-pressed="true">System</button>
        <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </div>
  <p class="avail" id="mast-avail" hidden></p>
</header>

<nav class="mainnav" aria-label="Console">
  <div class="nav-inner">
    <ul>
      <li><a href="#/">Validations</a></li>
      <li><a href="#/spec">Create validation</a></li>
      <li class="nav-separator" aria-hidden="true"></li>
      <li><a href="#/audit">Audit trail</a></li>
      <li><a href="#/evidence">Evidence</a></li>
    </ul>
    <p class="nav-context">Evidence, approvals, and traceability</p>
  </div>
</nav>

<section class="integrity" id="integrity-bar" aria-labelledby="integrity-h">
  <h2 id="integrity-h" class="vh">Integrity</h2>
</section>

<nav class="subnav" id="subnav" aria-label="This validation" hidden></nav>

<div class="announce vh" id="announce" role="status" aria-live="polite"></div>

<main id="main" tabindex="-1"></main>

<footer class="standing" role="contentinfo">
  <h2>What this does not do</h2>
  <p class="disclaimer" id="disc-1"></p>
  <ul class="limits" id="disc-rest"></ul>
</footer>

<script type="module" src="/static/app.js"></script>
</body>
</html>
