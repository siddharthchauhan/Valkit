name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Test
        run: python -m pytest -q

  core-only:
    name: Core imports without optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The core is meant to depend on PyYAML and Jinja2 and nothing else. A
      # lazy import that quietly became eager would not be caught by the test
      # job, where every extra is installed.
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import every core module
        run: |
          python - <<'PY'
          import importlib
          for name in [
              "valkit", "valkit.models", "valkit.util", "valkit.errors",
              "valkit.stats", "valkit.spec", "valkit.evals", "valkit.audit",
              "valkit.vault", "valkit.esign", "valkit.docgen", "valkit.trace",
              "valkit.drift", "valkit.change", "valkit.pipeline", "valkit.cli",
              "valkit.mcp",
          ]:
              importlib.import_module(name)
              print("ok", name)
          PY

      - name: Run the CLI
        run: |
          python -m valkit.cli --version
          python -m valkit.cli validate examples/valkit.yaml
          python -m valkit.cli sample-size --target 0.98

  demo:
    name: Demonstration runs end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # A broken demonstration is worse than a broken test: it is the first
      # thing anyone runs.
      - name: Demo
        run: python examples/demo.py --output out/ci

      - name: Confirm the package was produced
        run: |
          test -f out/ci/OQ_REPORT.md
          test -f out/ci/CREDIBILITY_REPORT.md
          test -f out/ci/VSR.md
          test -f out/ci/audit-trail.txt
          grep -q "Step 7 — Adequacy" out/ci/CREDIBILITY_REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: validation-package
          path: out/ci
