[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valkit"
version = "0.1.0"
description = "Part 11 validation-as-code for LLM agents in GxP workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ValKit" }]
keywords = ["gxp", "21-cfr-part-11", "gamp5", "validation", "llm", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Healthcare Industry",
]

# The core package deliberately depends only on PyYAML and Jinja2. A small
# dependency surface is a validation argument, not just an engineering one:
# every third-party package in a GxP tool is a supplier that has to be
# assessed. Statistics are implemented in pure Python (see valkit/stats) so
# that the acceptance engine can be qualified by inspection.
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
mcp = ["mcp>=1.0"]
docx = ["python-docx>=1.1"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-docx>=1.1",
  "boto3>=1.34",
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
valkit = "valkit.cli:main"

[tool.setuptools.packages.find]
include = ["valkit*", "api*"]

[tool.setuptools.package-data]
valkit = ["templates/**/*.j2", "templates/**/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:valkit.*"]
