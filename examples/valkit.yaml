# ValKit specification for an EDC build-support agent.
#
# This file is the contract between the team that builds the agent and the
# quality function that has to sign off on it. Everything ValKit generates -
# the requirements, the risk assessment, the IQ/OQ/PQ protocols, the
# credibility assessment and the validation summary - is derived from what is
# declared here, so it is worth writing carefully and reviewing as a controlled
# document in its own right.
#
# Run `valkit validate examples/valkit.yaml` to check it and see the derived
# risk assessment before executing anything.

apiVersion: valkit/v1
kind: AgentValidation

metadata:
  agent_id: rave-als-generator
  version: 2.3.1
  owner: fde@sponsor.example
  system_of_record: Medidata Rave EDC
  description: >
    Generates Archival Listing Specification (ALS) entries and suggests edit
    checks from an approved study protocol, for review by an EDC build engineer.

# Steps 1 and 2 of the FDA credibility framework. The question of interest is
# what the agent's output helps answer; the role says how the output is used and
# by whom. Together with the two risk axes below, this block determines how much
# evidence ValKit will require.
context_of_use:
  question_of_interest: >
    Does the agent correctly generate Archival Listing Specification (ALS)
    entries from a study protocol so that the EDC build is accurate?
  role: >
    Assistive. Every generated ALS entry is reviewed and accepted by a qualified
    EDC build engineer against the source protocol before it is loaded. The agent
    never writes to a production database.

  # How much the agent's output drives the decision, and how bad it is if the
  # decision is wrong. These are the two axes of the model risk matrix.
  model_influence: medium
  decision_consequence: medium

  regulatory_impact: medium
  human_in_the_loop: true
  patient_safety_impact: false
  product_quality_impact: false
  data_integrity_impact: true

# What the agent is and is not for. Out-of-scope entries become explicit negative
# requirements, so out-of-scope use is a testable failure rather than an
# unwritten assumption.
intended_use:
  in_scope:
    - Generating ALS field and form definitions from protocol text
    - Suggesting edit checks for generated fields
  out_of_scope:
    - Loading an ALS into a production EDC environment without human review
    - Interpreting protocol sections for clinical or medical judgement
    - Generating or modifying subject data
  users:
    - EDC build engineer
    - Clinical data manager
  limitations:
    - Validated against oncology and cardiology protocols only
    - Not evaluated on protocols with adaptive randomisation

gamp:
  # Category 5: the agent's behaviour comes from prompts, tools and a model
  # configuration specific to this use, so there is no supplier assurance to
  # lean on and no installed base.
  category: 5
  rationale: >
    Bespoke agent logic over a third-party foundation model. The model is a
    supplier component; the prompt, tool surface and acceptance criteria are
    bespoke.

models:
  # The demonstration runs entirely offline against a deterministic fixture
  # provider. Replace with a real provider (for example
  # bedrock/anthropic.claude-sonnet-4) for a live run.
  primary: fixture/rave-als
  judge: fixture/judge

  # Samples flagged as containing PHI are routed here. If PHI-flagged samples
  # exist and no local provider is configured, evaluation refuses to run rather
  # than sending them to a hosted endpoint.
  phi_safe_local: ollama/llama3.1:70b

  # Temperature zero and a pinned seed are what make a qualification run
  # repeatable. A non-zero temperature produces a warning at load time.
  temperature: 0.0
  seed: 0

datasets:
  # Pinning the digest is what makes the qualification run reproducible. Without
  # it the OQ cannot be repeated, because nothing records which data was used.
  # `valkit run` prints both digests; either may be pinned here.
  golden_set:
    ref: examples/datasets/rave_als_golden.jsonl
    sha256: 4efff9dc42c8698a6680a93c9fe8c0647ee1c33c29f3520f16543748f87d1994
    version: v7
    description: >
      65 curated ALS generation cases stratified across twelve CRF forms, with a
      human-labelled subset used to calibrate the judge and a set of derived
      fields that are genuinely harder.
  red_team:
    ref: examples/datasets/rave_als_redteam.jsonl
    sha256: 821a6655e68d7ccaad49ecb0e81460165d202806d56a518f57b23a2e769f3189
    version: v3
    description: >
      Prompt injection, out-of-scope requests, PHI elicitation and fabrication
      bait.

acceptance:
  # Read these targets together with the size of the golden set, because the two
  # are not independent. The acceptance claim is a one-sided lower confidence
  # bound, not the observed rate, and the bound is what a finite sample will
  # support. With 64 scored cases, a 0.95 target under the exact
  # (Clopper-Pearson) method tolerates ZERO failures; a 0.85 target tolerates
  # four. Demonstrating 0.95 with room for failures needs a substantially larger
  # set: 59 flawless cases for 0.95, 149 for 0.98, 299 for 0.99.
  #
  # So the honest options are to raise the target and enlarge the golden set, or
  # to state a target this set can actually support. This example does the
  # latter and says so. Run `valkit sample-size --target 0.98 --failures 2`
  # before committing to a target, not after the run.
  metrics:
    - name: field_accuracy
      type: proportion
      scorer: exact_match
      target: 0.85
      confidence: 0.95
      method: clopper_pearson_lower
      strata: [form]
      description: >
        The generated ALS field definition matches the reference exactly,
        including the supporting protocol sentence.

    - name: citation_accuracy
      type: proportion
      scorer: citation_accuracy
      target: 0.95
      confidence: 0.95
      method: wilson_lower
      description: >
        Every quoted protocol sentence occurs verbatim in the source document.
        This is the control against fabricated citations, which is the failure
        mode a reviewer is least able to catch by reading the output.

    - name: no_invented_identifiers
      type: proportion
      scorer: no_fabrication
      target: 0.90
      confidence: 0.95
      method: wilson_lower
      critical: false
      description: >
        Advisory screen for identifiers absent from both source and reference. A
        blunt check, reported but not gating: it is a screen, not a judgement.

  judge_calibration:
    # An LLM judge is an unvalidated measuring instrument until its agreement
    # with human assessment is quantified. Below this threshold, sign-off is
    # blocked.
    min_cohen_kappa: 0.80
    min_samples: 20
    required: true

monitoring:
  # A model provider can change behaviour without anything changing on your
  # side, so a validated status with no monitoring decays silently.
  schedule: "0 6 * * 1"
  spc_rule: western_electric
  window: 20
  alert_channels: [slack, jira]
  auto_change_control: true
  periodic_review_months: 6

signoff:
  # The CSV lead prepares the package and the QA lead approves it. Listing both
  # as approvers would make the package unsignable under the segregation rule
  # below, since the author may not also approve.
  approvers: [qa_lead]
  reviewers: [csv_lead]
  esignature: part11
  # The author of a validation document may not also approve it.
  require_distinct_signers: true
